name: Ten Grand Branch Cleanup Preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  deployments: read

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Analyze branches
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const { owner, repo } = context.repo;

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { owner, repo, per_page: 100 }
            );

            const pulls = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );

            const deployments = await github.rest.repos.listDeployments({
              owner,
              repo,
              per_page: 100
            });

            const protectedBranches = new Set([
              'main',
              'backup-before-hq-cleanup'
            ]);

            const rows = [];
            let ready = 0;
            let review = 0;
            let protectedCount = 0;

            for (const branch of branches) {
              const name = branch.name;

              if (protectedBranches.has(name)) {
                protectedCount++;
                rows.push({
                  name,
                  status: 'KEEP',
                  reason: 'Main or backup branch'
                });
                continue;
              }

              const openPR = pulls.some(
                pr => pr.head.repo?.full_name === `${owner}/${repo}` &&
                      pr.head.ref === name
              );

              const deployment = deployments.data.some(
                d => d.ref === name
              );

              if (branch.protected || openPR || deployment) {
                protectedCount++;
                rows.push({
                  name,
                  status: 'KEEP / INVESTIGATE',
                  reason: branch.protected
                    ? 'Protected branch'
                    : openPR
                    ? 'Open pull request'
                    : 'Referenced by a recent deployment'
                });
                continue;
              }

              try {
                const comparison =
                  await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: `main...${name}`
                  });

                if (comparison.data.ahead_by === 0) {
                  ready++;
                  rows.push({
                    name,
                    status: 'CLEANUP CANDIDATE',
                    reason: 'No commits missing from main'
                  });
                } else {
                  review++;
                  rows.push({
                    name,
                    status: 'ARCHIVED WORK - REVIEW',
                    reason: `${comparison.data.ahead_by} unique commits`
                  });
                }
              } catch (error) {
                review++;
                rows.push({
                  name,
                  status: 'REVIEW',
                  reason: 'Comparison failed'
                });
              }
            }

            let report = '# Ten Grand Branch Cleanup Preview\n\n';

            report += `Total branches: ${branches.length}\n\n`;
            report += `Cleanup candidates: ${ready}\n\n`;
            report += `Unique work / review: ${review}\n\n`;
            report += `Protected or reserved: ${protectedCount}\n\n`;

            report += '| Branch | Status | Reason |\n';
            report += '|---|---|---|\n';

            for (const row of rows) {
              const safeName = row.name.replaceAll('|', '\\|');
              report += `| ${safeName} | ${row.status} | ${row.reason} |\n`;
            }

            report += '\n## Important limitations\n\n';
            report += 'This workflow does not delete branches.\n\n';
            report += 'Only the 100 most recent deployments are checked.\n\n';
            report += 'External hosting services and active AI sessions must be checked separately.\n\n';
            report += 'Branches with unique commits require explicit review before deletion.\n';

            fs.writeFileSync('branch-cleanup-preview.md', report);

            await core.summary.addRaw(report).write();

      - name: Upload cleanup preview
        uses: actions/upload-artifact@v4
        with:
          name: ten-grand-cleanup-preview
          path: branch-cleanup-preview.md
          retention-days: 30
