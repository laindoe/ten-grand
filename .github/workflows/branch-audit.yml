name: Ten Grand Branch Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit all branches
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune

          {
            echo "# Ten Grand Branch Audit"
            echo
            echo "Branches are compared against main."
            echo
            echo "| Branch | Status | Commits ahead of main |"
            echo "|---|---|---:|"

            while IFS= read -r branch; do
              if [[ "$branch" == "main" ]]; then
                continue
              fi

              ahead=$(git rev-list --count "origin/main..origin/$branch")

              if [[ "$ahead" -eq 0 ]]; then
                status="MERGED - candidate for deletion"
              else
                status="REVIEW - contains unique commits"
              fi

              echo "| \`$branch\` | $status | $ahead |"
            done < <(git branch -r --format='%(refname:lstrip=3)' | grep -v '^HEAD$')
          } > branch-audit.md

          cat branch-audit.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: ten-grand-branch-audit
          path: branch-audit.md
