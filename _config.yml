title: Ten Grand
description: "Ten Grand — a scrollytelling site."
baseurl: "/ten-grand"
url: "https://laindoe.github.io"

markdown: kramdown

collections:
  broadcasts:
    output: false

# Clean URLs for every transmission: /transmissions/<slug>/
permalink: /transmissions/:slug/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: transmission

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - tools
  - docs
  - tests

# Keep the welcome pinned even when another post is marked featured.
welcome_transmission: /transmissions/the-next-horizon/
