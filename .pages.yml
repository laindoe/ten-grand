content:
  - name: broadcasts
    label: Broadcasts
    type: collection
    path: _broadcasts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{fields.title}.md"
    view:
      fields: [title, date, category]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: category
        label: Category
        type: string
        required: true
      - name: description
        label: Broadcast text
        description: "Short text shown on the card and at the top of Read More. Maximum 500 characters."
        type: text
        required: true
        options:
          maxlength: 500
      - name: body
        label: Additional content
        description: "Optional longer content shown below the original broadcast in the full-screen Read More modal."
        type: rich-text
        required: false
      - name: attachments
        label: Attachments
        description: "Optional files shown in Read More. Each attachment needs a label and a file."
        type: object
        list: true
        required: false
        fields:
          - name: label
            label: Attachment label
            type: string
            required: true
          - name: file
            label: File
            type: file
            required: true
            options:
              media: broadcast-files
      - name: sample
        label: Sample broadcast
        type: boolean
        default: false
  - name: transmissions
    label: Transmissions
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{fields.title}.md"
    view:
      fields: [title, date, series, format, featured]
    fields:
      - name: layout
        label: Layout
        type: string
        default: transmission
        hidden: true
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: series
        label: Series
        description: "Optional. Leave blank if this transmission isn't part of a recurring series."
        type: string
        required: false
      - name: format
        label: Format
        description: "Essay, Video Essay, Feature, Profile, Case Study, Documentary, etc."
        type: string
      - name: pillars
        label: TEME Pillars
        type: select
        list: true
        options:
          values:
            - Technology
            - Entertainment
            - Merchandise
            - Experiences
      - name: featured_image
        label: Featured Image
        type: image
      - name: excerpt
        label: Excerpt
        description: "Short description shown on cards and in the featured block."
        type: text
      - name: featured
        label: Featured on archive page
        type: boolean
        default: false
      - name: sample
        label: Sample content (shows a SAMPLE badge)
        type: boolean
        default: false
      - name: body
        label: Body
        type: rich-text

media:
  - name: images
    label: Images
    input: assets/images
    output: /assets/images
  - name: broadcast-files
    label: Broadcast attachments
    input: assets/files/broadcasts
    output: /assets/files/broadcasts
