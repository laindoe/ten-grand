<div class="vp" id="voice-player" role="dialog" aria-modal="true" aria-labelledby="vp-title" aria-hidden="true" hidden>
  <div class="vp__panel" tabindex="-1">
    <header class="vp__header">
      <button type="button" class="vp__icon-btn" data-vp-close aria-label="Close player">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
      <div class="vp__header-text">
        <h2 class="vp__title" id="vp-title">VOICES HEARD</h2>
        <p class="vp__playing-from" data-vp-from>Playing from All Voices</p>
      </div>
      <button type="button" class="vp__icon-btn vp__view-toggle" data-vp-view-toggle aria-label="Browse playlists" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg>
      </button>
    </header>

    <p class="vp__status" data-vp-status role="status" hidden></p>

    <section class="vp__now" data-vp-now aria-label="Now playing">
      <div class="vp__art" data-vp-art aria-hidden="true"></div>
      <div class="vp__meta">
        <p class="vp__role" data-vp-role></p>
        <h3 class="vp__track" data-vp-track>&nbsp;</h3>
        <p class="vp__artist" data-vp-artist></p>
      </div>
      <div class="vp__seek">
        <input type="range" class="vp__range" data-vp-seek min="0" max="1000" value="0" step="1" aria-label="Seek" />
        <div class="vp__times"><span data-vp-elapsed>0:00</span><span data-vp-total>0:00</span></div>
      </div>
      <div class="vp__controls">
        <button type="button" class="vp__icon-btn" data-vp-shuffle aria-pressed="true" aria-label="Shuffle on">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h3c5 0 6 10 11 10h4M3 17h3c1.6 0 2.8-.9 3.8-2.2M21 7h-4c-1.6 0-2.8.9-3.8 2.2M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>
        </button>
        <button type="button" class="vp__icon-btn" data-vp-prev aria-label="Previous voice">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="vp__fill"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button type="button" class="vp__play" data-vp-play aria-label="Play">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="vp__fill" data-vp-icon-play><path d="M8 5l12 7-12 7z"/></svg>
          <svg viewBox="0 0 24 24" aria-hidden="true" class="vp__fill" data-vp-icon-pause hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <button type="button" class="vp__icon-btn" data-vp-next aria-label="Next voice">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="vp__fill"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg>
        </button>
        <button type="button" class="vp__icon-btn vp__icon-btn--ghost" data-vp-queue-jump aria-label="Show up next">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        </button>
      </div>
      <div class="vp__queue">
        <h4 class="vp__queue-title">UP NEXT</h4>
        <ol class="vp__queue-list" data-vp-queue></ol>
      </div>
    </section>

    <section class="vp__playlists" data-vp-playlists aria-label="Playlists" hidden>
      <h3 class="vp__section-title">PLAYLISTS</h3>
      <div class="vp__grid" data-vp-grid></div>
    </section>

    <audio data-vp-audio preload="none"></audio>
  </div>
</div>
