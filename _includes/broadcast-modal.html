<dialog class="broadcast-modal" id="broadcast-modal" data-baseurl="{{ site.baseurl | escape }}" aria-labelledby="broadcast-modal-title">
  <div class="broadcast-modal__toolbar">
    <div class="broadcast-modal__toolbar-row">
    <nav class="broadcast-modal__crumb" aria-label="Breadcrumb">
      <span class="broadcast-slash" aria-hidden="true"></span>
      <a href="{{ '/community-wall/' | relative_url }}">COMMUNITY WALL</a>
      <span class="broadcast-slash" aria-hidden="true"></span>
      <button type="button" class="broadcast-modal__crumb-current" data-broadcast-close aria-label="Back to the current broadcast">BROADCASTS</button>
    </nav>
      <button type="button" class="broadcast-modal__close" data-broadcast-close aria-label="Close broadcast" autofocus><span aria-hidden="true">×</span></button>
    </div>
  </div>
  <div class="broadcast-modal__scroll">
    <div class="broadcast-modal__content" id="broadcast-modal-content"></div>
    <div class="broadcast-modal__back-wrap">
      <button type="button" class="broadcast-modal__back" data-broadcast-close><span aria-hidden="true">&larr;</span> BACK TO BROADCASTS</button>
    </div>
  </div>
</dialog>
