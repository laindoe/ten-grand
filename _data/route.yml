# Copy for the four route stops, in order down the road.  Placeholder for now.
# title/body feed the mobile modal (one <p> per blank-line-separated
# paragraph). headline/cta feed the desktop callout card instead -- a
# thematic headline tied to that stage's sign, and a short call-to-action
# closing line. Both read the same body copy.
# tag is the short line shown above the modal/callout's divider, with its
# dot colored to match. accent is that color (a hex value); leave it blank
# to fall back to the site's default --color-vandalism red.
- title: DEVELOPMENT
  headline: RED LIGHT, GREEN LIGHT
  body: |
    An idea can feel complete in your imagination long before it's ready to
    move. Development is where the vision has to become clear. Without the
    right guidance, resources, or collaborators, good ideas may never see a
    green light.
  cta: PAUSE & REFINE
  tag: Structure gives ideas a way forward
  accent:
- title: PRODUCTION
  headline: HURDLE AFTER HURDLE
  body: |
    Bringing an idea to life requires more than a good plan. Production
    depends on the right people, funding, equipment, spaces, and resources
    being available at the same time. Skipping one hurdle can result in
    projects falling flat.
  cta: ADJUST & REBUILD
  tag: Shared resources makes it easier to create
  accent: "#e5dc16"
