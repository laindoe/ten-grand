<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voices Heard — Ten Grand</title>
  <meta name="description" content="Meet the creators, builders, investors, and supporters sharing their voices with Ten Grand." />
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v=151" />
  <link rel="stylesheet" href="{{ '/css/community-wall.css' | relative_url }}?v=71" />
  <link rel="stylesheet" href="{{ '/css/broadcasts.css' | relative_url }}?v=5" />
</head>
<body>
  <div class="site-frame">
    {% include nav.html %}
    <main class="broadcasts">
      <div class="broadcasts__sticky">
        <div class="broadcasts__sticky-inner">
      <nav class="broadcasts__breadcrumb" aria-label="Breadcrumb">
        <span class="broadcasts__slash" aria-hidden="true">/</span>
        <a href="{{ '/community-wall/' | relative_url }}">COMMUNITY WALL</a>
        <span class="broadcasts__slash" aria-hidden="true">/</span>
        <a href="{{ '/community-wall/' | relative_url }}#campaigns">CAMPAIGNS</a>
      </nav>
        <header class="broadcasts__header">
          <h1 id="voices-title">VOICES HEARD</h1>
          <p>Share what you contribute, why it matters, and who you hope to reach.</p>
        </header>
        <div class="broadcasts__controls" role="group" aria-label="Voice search and filters (coming soon)">
          <div class="broadcasts__search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>
            <input type="search" placeholder="Search voices…" aria-label="Search voices (coming soon)" disabled />
          </div>
          <button class="broadcasts__filter" type="button" aria-label="Filter voices (coming soon)" disabled>FILTER <span aria-hidden="true">⌄</span></button>
        </div>
        </div>
      </div>
      <section class="broadcasts__results" aria-labelledby="voices-title">
        <div class="cw-voice-grid" id="voice-list" data-voice-archive aria-busy="true"></div>
        <p class="broadcasts__empty" id="voice-message" role="status">Loading voices…</p>
        <button type="button" class="broadcasts__load" id="voice-load-more" aria-controls="voice-list" hidden>LOAD MORE <span aria-hidden="true">↓</span></button>
        <p class="broadcasts__status" id="voice-status" role="status" aria-live="polite"></p>
      </section>
    </main>
  </div>
  {% include site-footer.html %}
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="{{ '/assets/js/supabase.js' | relative_url }}"></script>
  <script src="{{ '/js/community-wall.js' | relative_url }}?v=10"></script>
  <script src="{{ '/js/archive-header.js' | relative_url }}?v=2"></script>
</body>
</html>
