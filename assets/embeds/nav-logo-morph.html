<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N — Ten Grand Master</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:transparent;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;-webkit-tap-highlight-color:transparent;}
  .stage{width:100vmin;height:100vmin;position:relative;cursor:pointer;}
  .anim{position:absolute;inset:0;width:100%;height:100%;display:none;}
</style>
</head>
<body>
<div class="stage" id="stage" role="img" aria-label="The N logomark cycling through Technology, Entertainment, Merchandise and Experiences, returning to the N after each">
<svg id="tech_svg" class="anim" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="tech_webClip">
        <rect x="205" y="215" width="190" height="225"/>
      </clipPath>
    </defs>
    <g id="tech_mark" fill="#F5F4F2">
      <!-- verticals: N sides -> browser frame sides -> phone frame sides -->
      <rect id="tech_barL" x="210.9" y="80" width="5" height="440"/>
      <rect id="tech_barR" x="384.1" y="80" width="5" height="440"/>
      <!-- morphing beams: N diagonal halves -> browser top/bottom edges -> phone top/bottom edges -->
      <polygon id="tech_m1"/>
      <polygon id="tech_m2"/>

      <!-- browser chrome -->
      <rect id="tech_chromeDivider" x="190" y="195" width="220" height="3" opacity="0"/>
      <g id="tech_chromeDots" opacity="0">
        <circle cx="213" cy="175" r="5"/>
        <circle cx="231" cy="175" r="5"/>
        <circle cx="249" cy="175" r="5"/>
      </g>

      <!-- whole page scrolls together: hero, headline/subhead, then a two-column grid -->
      <g id="tech_webRows" clip-path="url(#tech_webClip)"></g>

      <!-- phone app -->
      <rect id="tech_phoneNotch" x="280" y="178" width="40" height="8" rx="4" opacity="0"/>
      <rect id="tech_phoneHome" x="275" y="380" width="50" height="5" rx="2.5" opacity="0"/>
      <g id="tech_phoneIcons"></g>
    </g>
  </svg>
<svg id="ent_svg" class="anim" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <clipPath id="ent_filmClip">
        <rect x="112" y="180" width="376" height="240"/>
      </clipPath>
      <clipPath id="ent_phoneClip">
        <rect x="196" y="116" width="208" height="368"/>
      </clipPath>
    </defs>
    <g id="ent_mark" fill="#F5F4F2">
      <!-- verticals -->
      <rect id="ent_barL" x="210.9" y="80" width="5" height="440"/>
      <rect id="ent_barR" x="384.1" y="80" width="5" height="440"/>
      <!-- morphing beams: logo diagonals -> film rails -> staff lines -> phone top/bottom -->
      <polygon id="ent_m1"/>
      <polygon id="ent_m2"/>
      <!-- frame dividers between the rails (the scene cells) -->
      <g id="ent_dividers" clip-path="url(#ent_filmClip)"></g>
      <!-- middle staff lines -->
      <rect id="ent_s1" y="257.5" height="5" x="300" width="0"/>
      <rect id="ent_s2" y="297.5" height="5" x="300" width="0"/>
      <rect id="ent_s3" y="337.5" height="5" x="300" width="0"/>
      <!-- melody -->
      <g id="ent_notes"></g>
      <!-- social feed inside the phone -->
      <g id="ent_feed" clip-path="url(#ent_phoneClip)"></g>
    </g>
    <!-- perforations punched into rails -->
    <g id="ent_perfs" fill="#161616" clip-path="url(#ent_filmClip)"></g>
  </svg>
<svg id="mer_svg" class="anim" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <g id="mer_mark" fill="#F5F4F2">
      <!-- verticals: N sides -> box sides -->
      <rect id="mer_barL" x="210.9" y="80" width="5" height="440"/>
      <rect id="mer_barR" x="384.1" y="80" width="5" height="440"/>
      <!-- morphing beams: N diagonals -> box top/bottom edges -->
      <polygon id="mer_m1"/>
      <polygon id="mer_m2"/>
      <!-- box flaps, hinged at the top corners -->
      <rect id="mer_flapL" x="206" y="206" width="94" height="8" opacity="0"/>
      <rect id="mer_flapR" x="300" y="206" width="94" height="8" opacity="0"/>
      <!-- products -->
      <g id="mer_itemTee" opacity="0">
        <polygon points="-16,-6 -8,-12 -4,-9 4,-9 8,-12 16,-6 11,1 7,-2 7,12 -7,12 -7,-2 -11,1"/>
      </g>
      <g id="mer_itemCap" opacity="0">
        <path d="M -11 3 A 11 11 0 0 1 11 3 L 24 7 L 24 10 L -11 10 Z"/>
      </g>
      <g id="mer_itemBear" opacity="0">
        <circle cx="-6" cy="-13" r="3.5"/>
        <circle cx="6" cy="-13" r="3.5"/>
        <circle cx="0" cy="-7" r="7.5"/>
        <ellipse cx="0" cy="6" rx="8" ry="9"/>
        <circle cx="-8" cy="3" r="3"/>
        <circle cx="8" cy="3" r="3"/>
        <circle cx="-5.5" cy="14.5" r="3.8"/>
        <circle cx="5.5" cy="14.5" r="3.8"/>
      </g>
      <!-- sparkles -->
      <g id="mer_sparkles"></g>
    </g>
  </svg>
<svg id="exp_svg" class="anim" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <g id="exp_mark" fill="#F5F4F2">
      <!-- N verticals -->
      <rect id="exp_barL"/>
      <rect id="exp_barR"/>
      <!-- N diagonals <-> ticket top/bottom edges -->
      <polygon id="exp_m1"/>
      <polygon id="exp_m2"/>
    </g>

    <!-- notched ticket sides: the bite is carved into the shape itself -->
    <g fill="#F5F4F2">
      <path id="exp_sideNL" opacity="0"/>
      <path id="exp_sideNR" opacity="0"/>
    </g>

    <!-- assembled-ticket decorations (primitive era) -->
    <g fill="#161616">
      <g id="exp_ripDashes" opacity="0" fill="#F5F4F2">
        <rect x="297.5" y="252" width="5" height="10"/>
        <rect x="297.5" y="270" width="5" height="10"/>
        <rect x="297.5" y="288" width="5" height="10"/>
        <rect x="297.5" y="306" width="5" height="10"/>
        <rect x="297.5" y="324" width="5" height="10"/>
        <rect x="297.5" y="342" width="5" height="10"/>
      </g>
    </g>

    <!-- LEFT ticket half: rips, then rigid-rotates 90deg clockwise -->
    <g id="exp_halfL" opacity="0">
      <g fill="#F5F4F2">
        <rect x="180" y="240" width="120" height="8"/>
        <rect x="180" y="352" width="120" height="8"/>
        <path id="exp_halfLside"/>
      </g>
      <path id="exp_tearL" fill="none" stroke="#F5F4F2" stroke-width="8"/>
    </g>

    <!-- RIGHT ticket half: rips and falls away -->
    <g id="exp_halfR" opacity="0">
      <g fill="#F5F4F2">
        <rect x="300" y="240" width="120" height="8"/>
        <rect x="300" y="352" width="120" height="8"/>
        <path id="exp_halfRside"/>
      </g>
      <path id="exp_tearR" fill="none" stroke="#F5F4F2" stroke-width="8"/>
    </g>
  </svg>
</div>
<script>
window.__anims = {};
(function(){
  "use strict";

  // ---------- beam geometry: 5-point polygons ----------
  var B1 = {
    N:  [[211.2,80],[218.8,80],[388.8,257.3],[388.8,297.9],[211.2,111.9]],
    BR: [[190,150],[410,150],[410,150],[410,156],[190,156]],
    PA: [[241,155],[359,155],[359,155],[359,163],[241,163]]
  };
  var B2 = {
    N:  [[211.2,304.6],[388.8,490.6],[388.8,520],[378.9,520],[211.2,344.7]],
    BR: [[190,444],[410,444],[410,450],[190,450],[190,450]],
    PA: [[241,397],[359,397],[359,405],[241,405],[241,405]]
  };

  // vertical bar states: {dx from center, y, h, w}
  var BN  = {dx:86.6, y:80,  h:440, w:5};  // logo position
  var BBr = {dx:110,  y:150, h:300, w:6};  // browser frame sides
  var BPh = {dx:55,   y:155, h:250, w:8};  // phone frame sides (shorter, true proportions)

  // ---------- timeline (ms) ----------
  var T = {
    holdN1:      [0,     700 ],
    toBrowser:   [700,   1900],
    chromeIn:    [1700,  2100],
    webScroll:   [1900,  3900],
    toPhone:     [3900,  4800],
    browserOut:  [3500,  3900],
    phoneChrome: [4500,  4900],
    phoneIn:     [4700,  5500],
    holdPhone:   [5500,  6300],
    phoneOut:    [6300,  6700],
    toN:         [6800,  7900],
    holdN2:      [7900,  9400]
  };
  var TOTAL = 9400;
  var ROW_SPEED = 0.14; // px/ms -- faster still, whole page moves briskly

  // ---------- helpers ----------
  function seg(t, r){
    if (t <= r[0]) return 0;
    if (t >= r[1]) return 1;
    return (t - r[0]) / (r[1] - r[0]);
  }
  function easeInOut(p){
    return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
  }
  function easeOut(p){
    return 1 - Math.pow(1 - p, 3);
  }
  function easeOutBack(p){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2);
  }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function mod(n, m){ return ((n % m) + m) % m; }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerpPts(A, B, p){
    var out = [];
    for (var i = 0; i < A.length; i++){
      out.push([lerp(A[i][0],B[i][0],p), lerp(A[i][1],B[i][1],p)]);
    }
    return out;
  }
  function ptsAttr(pts){
    return pts.map(function(pt){ return pt[0] + "," + pt[1]; }).join(" ");
  }
  function fadeInOut(t, inRange, outRange){
    var s = 0;
    if (t >= inRange[0] && t < outRange[0]) s = easeOut(Math.min(1, seg(t, inRange)));
    else if (t >= outRange[0] && t < outRange[1]) s = 1 - easeOut(seg(t, outRange));
    return clamp(s, 0, 1);
  }

  // ---------- dom ----------
  var $ = function(id){ return document.getElementById("tech_"+id) || document.createElement("div"); };
  var m1 = $("m1"), m2 = $("m2");
  var barL = $("barL"), barR = $("barR");
  var chromeDivider = $("chromeDivider"), chromeDots = $("chromeDots");
  var webRowsGroup = $("webRows");
  var phoneNotch = $("phoneNotch"), phoneHome = $("phoneHome"), phoneIconsGroup = $("phoneIcons");
  var label = $("phaseLabel");
  var fillEl = $("fill");
  var stage = $("stage");
  var progressEl = $("progress");

  // one long page strip: hero, headline/subhead, then 7 rows of two-column content.
  // Everything has a fixed position on the strip and the whole strip scrolls linearly --
  // no wraparound, so nothing can ever re-enter and collide with the hero.
  var pageItems = [
    {x:205, w:190, y:0,   h:110, type:'img',  hero:true}, // hero
    {x:205, w:150, y:120, h:7,   type:'line'},            // headline
    {x:205, w:110, y:132, h:6,   type:'line'}             // subhead
  ];
  var ROW_START = 155, ROW_BLOCK = 135, ROW_COUNT = 7;
  for (var ti = 0; ti < ROW_COUNT; ti++){
    var base = ROW_START + ti * ROW_BLOCK;
    [205, 310].forEach(function(colX){
      pageItems.push({x:colX, w:85, y:base,     h:90, type:'img'});
      pageItems.push({x:colX, w:65, y:base+98,  h:6,  type:'line'});
      pageItems.push({x:colX, w:45, y:base+109, h:6,  type:'line'});
    });
  }
  pageItems.forEach(function(el){
    var rr = document.createElementNS("http://www.w3.org/2000/svg","rect");
    rr.setAttribute("x", el.x);
    rr.setAttribute("rx", el.type === 'img' ? 6 : 3);
    webRowsGroup.appendChild(rr);
    el.el = rr;
  });

  // phone icon grid: 2 cols x 3 rows, each its own group for staggered pop-in
  var iconDefs = [
    {cx:278,cy:228},{cx:322,cy:228},
    {cx:278,cy:283},{cx:322,cy:283},
    {cx:278,cy:338},{cx:322,cy:338}
  ];
  var iconEls = iconDefs.map(function(n, idx){
    var g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("opacity", "0");
    var rect = document.createElementNS("http://www.w3.org/2000/svg","rect");
    rect.setAttribute("x", n.cx - 17);
    rect.setAttribute("y", n.cy - 17);
    rect.setAttribute("width", 34);
    rect.setAttribute("height", 34);
    rect.setAttribute("rx", 8);
    g.appendChild(rect);
    phoneIconsGroup.appendChild(g);
    return {el:g, cx:n.cx, cy:n.cy, idx:idx};
  });

  function setBars(b){
    barL.setAttribute("x", 300 - b.dx - b.w/2);
    barR.setAttribute("x", 300 + b.dx - b.w/2);
    [barL, barR].forEach(function(el){
      el.setAttribute("y", b.y);
      el.setAttribute("height", b.h);
      el.setAttribute("width", b.w);
    });
  }
  function lerpBar(A, B, p){
    return { dx:lerp(A.dx,B.dx,p), y:lerp(A.y,B.y,p), h:lerp(A.h,B.h,p), w:lerp(A.w,B.w,p) };
  }

  function labelFor(t){
    if (t < T.toBrowser[0]) return "Ten Grand Technology";
    if (t < T.toPhone[0])   return "Web";
    if (t < T.toN[0])       return "App";
    return "Ten Grand Technology";
  }

  // ---------- render ----------
  function render(t){
    // beams: N -> browser edges -> phone edges -> N
    var from = "N", to = "N", p = 0;
    if (t >= T.toBrowser[0] && t < T.toBrowser[1]){
      from = "N"; to = "BR"; p = easeInOut(seg(t, T.toBrowser));
    } else if (t >= T.toBrowser[1] && t < T.toPhone[0]){
      from = "BR"; to = "BR";
    } else if (t >= T.toPhone[0] && t < T.toPhone[1]){
      from = "BR"; to = "PA"; p = easeInOut(seg(t, T.toPhone));
    } else if (t >= T.toPhone[1] && t < T.toN[0]){
      from = "PA"; to = "PA";
    } else if (t >= T.toN[0] && t < T.toN[1]){
      from = "PA"; to = "N"; p = easeInOut(seg(t, T.toN));
    }
    m1.setAttribute("points", ptsAttr(lerpPts(B1[from], B1[to], p)));
    m2.setAttribute("points", ptsAttr(lerpPts(B2[from], B2[to], p)));

    // bars: N -> browser sides -> phone sides -> N
    var b = BN;
    if (t >= T.toBrowser[0] && t < T.toBrowser[1]) b = lerpBar(BN, BBr, easeInOut(seg(t, T.toBrowser)));
    else if (t >= T.toBrowser[1] && t < T.toPhone[0]) b = BBr;
    else if (t >= T.toPhone[0] && t < T.toPhone[1]) b = lerpBar(BBr, BPh, easeInOut(seg(t, T.toPhone)));
    else if (t >= T.toPhone[1] && t < T.toN[0]) b = BPh;
    else if (t >= T.toN[0] && t < T.toN[1]) b = lerpBar(BPh, BN, easeInOut(seg(t, T.toN)));
    setBars(b);

    // browser chrome: dots + divider
    var chromeS = fadeInOut(t, T.chromeIn, T.browserOut);
    chromeDivider.setAttribute("opacity", chromeS);
    chromeDots.setAttribute("opacity", chromeS);

    // the whole page strip scrolls at one constant speed -- hero included
    var feedS = fadeInOut(t, [T.chromeIn[0], T.chromeIn[0] + 400], T.browserOut);
    var scrollOffset = ROW_SPEED * Math.max(0, t - T.webScroll[0]);
    pageItems.forEach(function(el){
      var top = 215 + el.y - scrollOffset;
      el.el.setAttribute("y", top);
      el.el.setAttribute("height", el.h);
      el.el.setAttribute("width", el.w);
      if (el.hero){
        el.el.setAttribute("opacity", feedS);
        return;
      }
      var center = top + el.h/2;
      var vis = clamp(Math.min((440 - center)/40, (center - 215)/40, 1), 0, 1);
      el.el.setAttribute("opacity", vis * feedS * (el.type === 'line' ? 0.55 : 1));
    });

    // phone chrome: notch + home indicator
    var phoneChromeS = fadeInOut(t, T.phoneChrome, T.phoneOut);
    phoneNotch.setAttribute("opacity", phoneChromeS);
    phoneHome.setAttribute("opacity", phoneChromeS);

    // phone icons: pop in one by one, fade out together
    iconEls.forEach(function(n){
      var inStart = T.phoneIn[0] + n.idx * 140;
      var s = 0;
      if (t >= inStart && t < T.phoneOut[0]){
        s = easeOutBack(Math.min(1, (t - inStart) / 380));
      } else if (t >= T.phoneOut[0] && t < T.phoneOut[1]){
        s = 1 - easeInOut(seg(t, T.phoneOut));
      }
      s = Math.max(0, s);
      n.el.setAttribute("opacity", Math.min(1, s * 1.3));
      n.el.setAttribute("transform",
        "translate(" + (n.cx * (1 - s)) + " " + (n.cy * (1 - s)) + ") scale(" + s + ")");
    });

    label.textContent = labelFor(t);
    fillEl.style.width = (t / TOTAL * 100) + "%";
  }

  
  window.__anims.tech = {render: render, TOTAL: TOTAL};
})();
(function(){
  "use strict";

  // ---------- beam geometry: 5-point polygons, traced from the source logo ----------
  // m1 point order: TL, TR, TR', BR, BL   (TR' collapses into TR when rectangular)
  // m2 point order: TL, TR, BR, BL', BL   (BL' collapses into BL when rectangular)
  var B1 = {
    N:  [[211.2,80],[218.8,80],[388.8,257.3],[388.8,297.9],[211.2,111.9]],
    R:  [[112,192],[488,192],[488,192],[488,238],[112,238]],
    ST: [[117.5,217.5],[482.5,217.5],[482.5,217.5],[482.5,222.5],[117.5,222.5]],
    PH: [[188,108],[412,108],[412,108],[412,116],[188,116]]
  };
  var B2 = {
    N:  [[211.2,304.6],[388.8,490.6],[388.8,520],[378.9,520],[211.2,344.7]],
    R:  [[112,362],[488,362],[488,408],[112,408],[112,408]],
    ST: [[117.5,377.5],[482.5,377.5],[482.5,382.5],[117.5,382.5],[117.5,382.5]],
    PH: [[188,484],[412,484],[412,492],[188,492],[188,492]]
  };

  // vertical bar states: {dx from center, y, h, w}
  var BN = {dx:86.6, y:80, h:440, w:5};    // logo / staff position
  var BF = {dx:180, y:192, h:216, w:16};   // film-frame position (flush with rail edges)
  var BS = {dx:180, y:217.5, h:165, w:5};  // staff barlines (flush with outer staff lines)
  var BP = {dx:108, y:108, h:384, w:8};    // phone edges (flush with top/bottom beams)

  // ---------- timeline (ms) ----------
  var T = {
    holdN1:      [0,     900 ],
    straighten:  [900,   2100],
    perfIn:      [2100,  2900],
    dividersIn:  [2900,  3400],
    play:        [3400,  6400],
    perfOut:     [6500,  7050],
    toStaff:     [7100,  8300],
    linesIn:     [7400,  8600],
    noteIn:      [8300,  9100],
    holdStaff:   [9100, 10300],
    noteOut:     [10300, 10800],
    linesOut:    [10300, 11100],
    toPhone:     [11200, 12400],
    feedIn:      [12400, 13200],
    feedScroll:  [13200, 15200],
    feedOut:     [15200, 15700],
    toN:         [15800, 17200],
    holdN2:      [17200, 19500]
  };
  var TOTAL = 19500;
  var SCROLL_DIST = 600;  // film: multiple of both pattern periods, lands realigned
  var FEED_DIST = 348;    // feed: two posts scroll by

  // ---------- helpers ----------
  function seg(t, r){
    if (t <= r[0]) return 0;
    if (t >= r[1]) return 1;
    return (t - r[0]) / (r[1] - r[0]);
  }
  function easeInOut(p){
    return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
  }
  function easeOut(p){
    return 1 - Math.pow(1 - p, 3);
  }
  function easeOutBack(p){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2);
  }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function mod(n, m){ return ((n % m) + m) % m; }
  function lerpPts(A, B, p){
    var out = [];
    for (var i = 0; i < A.length; i++){
      out.push([lerp(A[i][0],B[i][0],p), lerp(A[i][1],B[i][1],p)]);
    }
    return out;
  }
  function ptsAttr(pts){
    return pts.map(function(pt){ return pt[0] + "," + pt[1]; }).join(" ");
  }

  // ---------- dom ----------
  var $ = function(id){ return document.getElementById("ent_"+id) || document.createElement("div"); };
  var m1 = $("m1"), m2 = $("m2");
  var barL = $("barL"), barR = $("barR");
  var mids = [$("s1"), $("s2"), $("s3")];
  var notesGroup = $("notes");
  var perfsGroup = $("perfs");
  var dividersGroup = $("dividers");
  var feedGroup = $("feed");
  var label = $("phaseLabel");
  var fillEl = $("fill");
  var stage = $("stage");
  var progressEl = $("progress");

  // perforations: 10 per rail tiling every 50px (wraps over a 500px period)
  var perfRects = [];
  [215,385].forEach(function(cy){
    for (var i = 0; i < 10; i++){
      var r = document.createElementNS("http://www.w3.org/2000/svg","rect");
      perfsGroup.appendChild(r);
      perfRects.push({el:r, cx:100 + i*50, cy:cy, i:i});
    }
  });

  // frame dividers: 4 bars tiling every 150px (wraps over a 600px period)
  var dividerRects = [];
  for (var d = 0; d < 4; d++){
    var dr = document.createElementNS("http://www.w3.org/2000/svg","rect");
    dividersGroup.appendChild(dr);
    dividerRects.push({el:dr, cx:175 + d*150});
  }
  var DIV_W = 14, DIV_TOP = 238, DIV_BOT = 362;

  // melody: quarter notes stepping across the staff (staff lines y 220..380, spacing 40)
  var noteDefs = [
    {cx:180, cy:340},
    {cx:265, cy:300},
    {cx:350, cy:280},
    {cx:435, cy:320}
  ];

    }
    var rI = r + 8;                                  // inner detour radius
    var phiI = Math.acos(8 / rI);                    // inner intersection angle
    var base = dirIn > 0 ? 0 : Math.PI;              // bulge direction
    function arc(radius, thFrom, thTo){
      var s = "";
      for (var i = 0; i <= 10; i++){
        var th = thFrom + (thTo - thFrom) * i / 10;
        s += " L" + (xO + radius * Math.cos(th)) + " " + (300 + radius * Math.sin(th));
      }
      return s;
    }
    var aI = Math.sqrt(Math.max(0, rI * rI - 64));
    var d = "M" + xO + " 240"
          + " L" + xI + " 240"
          + " L" + xI + " " + (300 - aI)
          + arc(rI, base - dirIn * phiI, base + dirIn * phiI)  // inner edge detours around
          + " L" + xI + " 360"
          + " L" + xO + " 360"
          + " L" + xO + " " + (300 + r)
          + arc(r, base + dirIn * Math.PI / 2, base - dirIn * Math.PI / 2) // outer edge follows the bite
          + " Z";
    return d;
  }

  // ---------- dom ----------
  var $ = function(id){ return document.getElementById("exp_"+id) || document.createElement("div"); };
  var m1 = $("m1"), m2 = $("m2");
  var barL = $("barL"), barR = $("barR");
  var sideNL = $("sideNL"), sideNR = $("sideNR");
  var ripDashes = $("ripDashes");
  var halfL = $("halfL"), halfR = $("halfR");
  var tearL = $("tearL"), tearR = $("tearR");
  var halfLside = $("halfLside"), halfRside = $("halfRside");
  var label = $("phaseLabel");
  var fillEl = $("fill");
  var stage = $("stage");
  var progressEl = $("progress");

  tearL.setAttribute("d", tearPath(296, 8));
  tearR.setAttribute("d", tearPath(304, -8));
  halfLside.setAttribute("d", sidePath(180, 1, 11));
  halfRside.setAttribute("d", sidePath(420, -1, 11));

  function labelFor(t){
    if (t < T.toTicket[0])  return "Ten Grand Experiences";
    if (t < T.slant[1])     return "Admit One";
    return "Ten Grand Experiences";
  }

  // ---------- render ----------
  function render(t){
    var primO = (t >= T.rip[0] && t < T.leftRotate[1]) ? 0 : 1;

    // ----- beams -----
    var pts1, pts2;
    if (t < T.toTicket[0]){
      pts1 = B1.N; pts2 = B2.N;
    } else if (t < T.toTicket[1]){
      var tp = easeInOut(seg(t, T.toTicket));
      pts1 = lerpPts(B1.N, B1.TK, tp);
      pts2 = lerpPts(B2.N, B2.TK, tp);
    } else if (t < T.rip[0]){
      pts1 = B1.TK; pts2 = B2.TK;
    } else if (t < T.thicken[0]){
      // hidden during the rip and rotation; parked at the square state
      pts1 = B1.SQ; pts2 = B2.SQ;
    } else if (t < T.slant[0]){
      var thp = easeInOut(seg(t, T.thicken));
      pts1 = lerpPts(B1.SQ, B1.TH, thp);
      pts2 = lerpPts(B2.SQ, B2.TH, thp);
    } else if (t < T.slant[1]){
      var sp = easeInOut(seg(t, T.slant));
      pts1 = lerpPts(B1.TH, B1.N, sp);
      pts2 = lerpPts(B2.TH, B2.N, sp);
    } else {
      pts1 = B1.N; pts2 = B2.N;
    }
    m1.setAttribute("points", ptsAttr(pts1));
    m2.setAttribute("points", ptsAttr(pts2));
    m1.setAttribute("opacity", primO);
    m2.setAttribute("opacity", primO);

    // ----- bars -----
    var bL, bR, bO = primO;
    if (t < T.toTicket[0]){
      bL = BAR.NL; bR = BAR.NR;
    } else if (t < T.toTicket[1]){
      var bp = easeInOut(seg(t, T.toTicket));
      bL = lerpRect(BAR.NL, BAR.TKL, bp);
      bR = lerpRect(BAR.NR, BAR.TKR, bp);
    } else if (t < T.notchesIn[0]){
      bL = BAR.TKL; bR = BAR.TKR;
    } else if (t < T.rip[0]){
      // the notched side paths render the sides during this window
      bL = BAR.TKL; bR = BAR.TKR; bO = 0;
    } else if (t < T.barsExtend[0]){
      // parked at square-frame sides while hidden / after swap
      bL = BAR.SQL; bR = BAR.SQR;
    } else if (t < T.barsExtend[1]){
      var ep = easeInOut(seg(t, T.barsExtend));
      bL = lerpRect(BAR.SQL, BAR.NL, ep);
      bR = lerpRect(BAR.SQR, BAR.NR, ep);
    } else {
      bL = BAR.NL; bR = BAR.NR;
    }
    setRect(barL, bL, bO);
    setRect(barR, bR, bO);

    // ----- notched ticket sides + perforation (primitive era only) -----
    var deco = (t >= T.rip[0]) ? 0 : 1;
    var sidesOn = (t >= T.notchesIn[0] && t < T.rip[0]) ? 1 : 0;
    if (sidesOn){
      var nr = 11 * easeOut(seg(t, T.notchesIn));
      sideNL.setAttribute("d", sidePath(180, 1, nr));
      sideNR.setAttribute("d", sidePath(420, -1, nr));
    }
    sideNL.setAttribute("opacity", sidesOn);
    sideNR.setAttribute("opacity", sidesOn);
    var dashO = easeOut(Math.min(1, seg(t, T.dashesIn))) * deco;
    ripDashes.setAttribute("opacity", dashO);

    // ----- ripped halves -----
    var hLo = 0, hRo = 0, hLt = "", hRt = "";
    if (t >= T.rip[0] && t < T.leftRotate[1]){
      hLo = 1;
      var jp = easeOut(seg(t, T.rip));
      var lTx = -10 * jp, lTy = 2 * jp, lRot = -3 * jp;
      var rTx = 12 * jp,  rTy = 8 * jp, rRot = 5 * jp;

      // right half falls away
      if (t >= T.fallR[0]){
        var fp = easeIn(seg(t, T.fallR));
        rTx = 12 + 85 * fp;
        rTy = 8 + 215 * fp;
        rRot = 5 + 48 * fp;
        hRo = 1 - fp;
      } else {
        hRo = 1;
      }

      // left half: rigid clockwise quarter-turn about its center (240, 300)
      if (t >= T.leftRotate[0]){
        var rp = easeInOut(seg(t, T.leftRotate));
        lRot = -3 + 93 * rp;             // -3 -> 90
        lTx = -10 * (1 - rp) + 60 * rp;  // jolt eases out; half travels to center
        lTy = 2 * (1 - rp);
        // tear and notch both smooth flat in the final stretch of the turn
        var smooth = clamp((rp - 0.8) / 0.2, 0, 1);
        tearL.setAttribute("d", tearPath(296, 8 * (1 - smooth)));
        halfLside.setAttribute("d", sidePath(180, 1, 11 * (1 - smooth)));
      } else {
        tearL.setAttribute("d", tearPath(296, 8));
        halfLside.setAttribute("d", sidePath(180, 1, 11));
      }

      hLt = "translate(" + lTx + " " + lTy + ") rotate(" + lRot + " 240 300)";
      hRt = "translate(" + rTx + " " + rTy + ") rotate(" + rRot + " 360 300)";
    }
    halfL.setAttribute("opacity", hLo);
    halfR.setAttribute("opacity", clamp(hRo, 0, 1));
    halfL.setAttribute("transform", hLt);
    halfR.setAttribute("transform", hRt);

    label.textContent = labelFor(t);
    fillEl.style.width = (t / TOTAL * 100) + "%";
  }

  
  window.__anims.exp = {render: render, TOTAL: TOTAL};
})();
(function(){
  "use strict";
  var SEGS = [{k:"tech",end:7900,off:0,hold:2100},{k:"ent",end:17200,off:0,hold:2300},{k:"mer",end:8500,off:0,hold:2300},{k:"exp",end:7100,off:0,hold:2300}];
  var HOLD = 800, A = window.__anims;
  var starts = [], total = 0;
  SEGS.forEach(function(s){ s.dur = s.end - s.off + s.hold; starts.push(total); total += s.dur; });
  var svgEls = SEGS.map(function(s){ return document.getElementById(s.k + "_svg"); });
  var cur = -1;
  function renderMaster(t){
    var i = SEGS.length - 1;
    while (i > 0 && t < starts[i]) i--;
    var s = SEGS[i];
    var local = Math.min(s.end, s.off + (t - starts[i]));
    if (i !== cur){
      svgEls.forEach(function(e, j){ e.style.display = (j === i) ? "block" : "none"; });
      cur = i;
    }
    A[s.k].render(local);
  }
  window.__tgMaster = {render: renderMaster, TOTAL: total, SEGS: SEGS, starts: starts};
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var playing = !reduced, startTime = null, pausedAt = 0;
  function frame(now){
    if (startTime === null) startTime = now - pausedAt;
    var t = (now - startTime) % total;
    renderMaster(t);
    pausedAt = t;
    if (playing) requestAnimationFrame(frame);
  }
  document.getElementById("stage").addEventListener("click", function(){
    playing = !playing;
    if (playing){ startTime = null; requestAnimationFrame(frame); }
  });
  renderMaster(0);
  if (playing) requestAnimationFrame(frame);
})();
</script>
</body>
