<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N — Ten Grand Merchandise</title>
<style>
  :root{
    --ink:#161616;
    --paper:#F5F4F2;
    --dim:#7a7a78;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:transparent;
    color:var(--paper);
    font-family:"Futura","Avenir Next","Century Gothic","Trebuchet MS",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .label{
    display:none;
    font-size:11px;
    letter-spacing:0.5em;
    text-indent:0.5em;
    text-transform:uppercase;
    color:var(--dim);
    height:16px;
    text-align:center;
  }
  .stage{
    width:min(90vmin,600px);
    height:min(90vmin,600px);
    cursor:pointer;
  }
  svg{width:100%;height:100%;display:block;}
  .progress{
    display:none;
    width:min(78vmin,520px);
    height:1px;
    background:#2c2c2b;
    position:relative;
    cursor:pointer;
  }
  .progress::after{
    content:"";
    position:absolute;
    inset:-8px 0;
  }
  .progress-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:0%;
    background:var(--paper);
  }
  .tagline{
    display:none;
    margin-top:26px;
    font-size:11px;
    letter-spacing:0.42em;
    text-indent:0.42em;
    color:var(--dim);
    text-align:center;
  }
  .hint{
    display:none;
    margin-top:10px;
    font-size:9px;
    letter-spacing:0.3em;
    text-indent:0.3em;
    color:#3d3d3c;
    text-transform:uppercase;
  }
  @media (prefers-reduced-motion: reduce){
    .hint{display:none;}
  }
</style>
</head>
<body>

<div class="label" id="phaseLabel">Ten Grand Merchandise</div>

<div class="stage" id="stage" role="img" aria-label="The N logomark morphing into a box that opens to release merchandise items which float away, then the box closes and returns to the N">
  <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
    <g id="mark" fill="#F5F4F2">
      <!-- verticals: N sides -> box sides -->
      <rect id="barL" x="210.9" y="80" width="5" height="440"/>
      <rect id="barR" x="384.1" y="80" width="5" height="440"/>
      <!-- morphing beams: N diagonals -> box top/bottom edges -->
      <polygon id="m1"/>
      <polygon id="m2"/>
      <!-- box flaps, hinged at the top corners -->
      <rect id="flapL" x="206" y="206" width="94" height="8" opacity="0"/>
      <rect id="flapR" x="300" y="206" width="94" height="8" opacity="0"/>
      <!-- products -->
      <g id="itemTee" opacity="0">
        <polygon points="-16,-6 -8,-12 -4,-9 4,-9 8,-12 16,-6 11,1 7,-2 7,12 -7,12 -7,-2 -11,1"/>
      </g>
      <g id="itemCap" opacity="0">
        <path d="M -11 3 A 11 11 0 0 1 11 3 L 24 7 L 24 10 L -11 10 Z"/>
      </g>
      <g id="itemBear" opacity="0">
        <circle cx="-6" cy="-13" r="3.5"/>
        <circle cx="6" cy="-13" r="3.5"/>
        <circle cx="0" cy="-7" r="7.5"/>
        <ellipse cx="0" cy="6" rx="8" ry="9"/>
        <circle cx="-8" cy="3" r="3"/>
        <circle cx="8" cy="3" r="3"/>
        <circle cx="-5.5" cy="14.5" r="3.8"/>
        <circle cx="5.5" cy="14.5" r="3.8"/>
      </g>
      <!-- sparkles -->
      <g id="sparkles"></g>
    </g>
  </svg>
</div>

<div class="progress" id="progress"><div class="progress-fill" id="fill"></div></div>

<div class="tagline">aMASS Comm(unity)</div>
<div class="hint">Tap mark to pause</div>

<script>
(function(){
  "use strict";

  // ---------- beam geometry: 5-point polygons, traced from the source logo ----------
  var B1 = {
    N:  [[211.2,80],[218.8,80],[388.8,257.3],[388.8,297.9],[211.2,111.9]],
    BX: [[206,206],[394,206],[394,206],[394,214],[206,214]]
  };
  var B2 = {
    N:  [[211.2,304.6],[388.8,490.6],[388.8,520],[378.9,520],[211.2,344.7]],
    BX: [[206,396],[394,396],[394,404],[206,404],[206,404]]
  };

  // vertical bar states: {dx from center, y, h, w}
  var BN  = {dx:86.6, y:80,  h:440, w:5};  // logo position
  var BBx = {dx:90,   y:206, h:198, w:8};  // box sides (flush with top/bottom edges)

  // ---------- timeline (ms) ----------
  var T = {
    holdN1:     [0,     700 ],
    toBox:      [700,   1900],
    flapsOpen:  [2100,  2800],
    itemsOut:   [2800,  3700],
    float:      [3700,  5400],
    vanish:     [5400,  6300],
    flapsClose: [6500,  7200],
    toN:        [7400,  8500],
    holdN2:     [8500, 10000]
  };
  var TOTAL = 10000;

  // ---------- helpers ----------
  function seg(t, r){
    if (t <= r[0]) return 0;
    if (t >= r[1]) return 1;
    return (t - r[0]) / (r[1] - r[0]);
  }
  function easeInOut(p){
    return p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
  }
  function easeOut(p){
    return 1 - Math.pow(1 - p, 3);
  }
  function easeOutBack(p){
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3*Math.pow(p-1,3) + c1*Math.pow(p-1,2);
  }
  function lerp(a, b, p){ return a + (b - a) * p; }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function lerpPts(A, B, p){
    var out = [];
    for (var i = 0; i < A.length; i++){
      out.push([lerp(A[i][0],B[i][0],p), lerp(A[i][1],B[i][1],p)]);
    }
    return out;
  }
  function ptsAttr(pts){
    return pts.map(function(pt){ return pt[0] + "," + pt[1]; }).join(" ");
  }

  // ---------- dom ----------
  var $ = function(id){ return document.getElementById(id); };
  var m1 = $("m1"), m2 = $("m2");
  var barL = $("barL"), barR = $("barR");
  var flapL = $("flapL"), flapR = $("flapR");
  var sparklesGroup = $("sparkles");
  var label = $("phaseLabel");
  var fillEl = $("fill");
  var stage = $("stage");
  var progressEl = $("progress");

  // products: start inside the box mouth, rise to float positions
  var items = [
    {el: $("itemTee"),  fx:222, fy:118, delay:0,   bobPhase:0},
    {el: $("itemCap"),  fx:302, fy:72,  delay:220, bobPhase:2.1},
    {el: $("itemBear"), fx:380, fy:126, delay:440, bobPhase:4.2}
  ];
  var MOUTH_X = 300, MOUTH_Y = 250;

  // sparkles: little plus signs around the float zone
  var sparkleDefs = [
    {x:210, y:95},  {x:270, y:60},  {x:335, y:55},
    {x:395, y:100}, {x:250, y:160}, {x:352, y:168}
  ];
  var sparkleEls = sparkleDefs.map(function(s, i){
    var g = document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("opacity", "0");
    var v = document.createElementNS("http://www.w3.org/2000/svg","rect");
    v.setAttribute("x", s.x - 1.5); v.setAttribute("y", s.y - 6);
    v.setAttribute("width", 3); v.setAttribute("height", 12);
    var h = document.createElementNS("http://www.w3.org/2000/svg","rect");
    h.setAttribute("x", s.x - 6); h.setAttribute("y", s.y - 1.5);
    h.setAttribute("width", 12); h.setAttribute("height", 3);
    g.appendChild(v); g.appendChild(h);
    sparklesGroup.appendChild(g);
    return {el:g, phase:i * 1.1};
  });

  function setBars(b){
    barL.setAttribute("x", 300 - b.dx - b.w/2);
    barR.setAttribute("x", 300 + b.dx - b.w/2);
    [barL, barR].forEach(function(el){
      el.setAttribute("y", b.y);
      el.setAttribute("height", b.h);
      el.setAttribute("width", b.w);
    });
  }
  function lerpBar(A, B, p){
    return { dx:lerp(A.dx,B.dx,p), y:lerp(A.y,B.y,p), h:lerp(A.h,B.h,p), w:lerp(A.w,B.w,p) };
  }

  function labelFor(t){
    if (t < T.toBox[0])      return "Ten Grand Merchandise";
    if (t < T.itemsOut[0])   return "Unboxing";
    if (t < T.flapsClose[0]) return "Products";
    if (t < T.toN[1])        return "Unboxing";
    return "Ten Grand Merchandise";
  }

  // ---------- render ----------
  function render(t){
    // beams: N -> box top/bottom -> N
    var from = "N", to = "N", p = 0;
    if (t >= T.toBox[0] && t < T.toBox[1]){
      from = "N"; to = "BX"; p = easeInOut(seg(t, T.toBox));
    } else if (t >= T.toBox[1] && t < T.toN[0]){
      from = "BX"; to = "BX";
    } else if (t >= T.toN[0] && t < T.toN[1]){
      from = "BX"; to = "N"; p = easeInOut(seg(t, T.toN));
    }
    m1.setAttribute("points", ptsAttr(lerpPts(B1[from], B1[to], p)));
    m2.setAttribute("points", ptsAttr(lerpPts(B2[from], B2[to], p)));

    // bars: N -> box sides -> N
    var b = BN;
    if (t >= T.toBox[0] && t < T.toBox[1]) b = lerpBar(BN, BBx, easeInOut(seg(t, T.toBox)));
    else if (t >= T.toBox[1] && t < T.toN[0]) b = BBx;
    else if (t >= T.toN[0] && t < T.toN[1]) b = lerpBar(BBx, BN, easeInOut(seg(t, T.toN)));
    setBars(b);

    // flaps: swing open from the top corners, swing closed before the return
    var flapAngle = 0, flapVis = 0;
    if (t >= T.flapsOpen[0] && t < T.flapsClose[0]){
      flapAngle = 118 * easeOutBack(seg(t, T.flapsOpen));
      flapVis = 1;
    } else if (t >= T.flapsClose[0] && t < T.flapsClose[1]){
      flapAngle = 118 * (1 - easeInOut(seg(t, T.flapsClose)));
      flapVis = 1;
    } else if (t >= T.flapsClose[1] && t < T.toN[0]){
      flapAngle = 0; flapVis = 1;
    }
    flapL.setAttribute("opacity", flapVis);
    flapR.setAttribute("opacity", flapVis);
    flapL.setAttribute("transform", "rotate(" + (-flapAngle) + " 206 210)");
    flapR.setAttribute("transform", "rotate(" + flapAngle + " 394 210)");

    // products: rise out of the mouth, bob while floating, dissolve into the air
    items.forEach(function(it){
      var s = 0, x = MOUTH_X, y = MOUTH_Y;
      var inStart = T.itemsOut[0] + it.delay;
      if (t >= inStart && t < T.vanish[0]){
        var rp = easeOutBack(Math.min(1, (t - inStart) / 750));
        var rpc = clamp(rp, 0, 1.2);
        s = clamp(rp, 0, 1);
        x = lerp(MOUTH_X, it.fx, rpc);
        y = lerp(MOUTH_Y, it.fy, rpc);
        // gentle bob once risen
        if (rp >= 1) y += 4 * Math.sin(t / 420 + it.bobPhase);
      } else if (t >= T.vanish[0] && t < T.vanish[1]){
        var vp = clamp((t - (T.vanish[0] + it.delay * 0.5)) / 500, 0, 1);
        s = 1 - easeInOut(vp);
        x = it.fx;
        y = it.fy - 18 * easeOut(vp); // drift up as they dissolve
      }
      s = Math.max(0, s);
      it.el.setAttribute("opacity", Math.min(1, s * 1.3));
      it.el.setAttribute("transform", "translate(" + x + " " + y + ") scale(" + (s * 1.8) + ")");
    });

    // sparkles: twinkle during the float, flare as products vanish
    sparkleEls.forEach(function(sp){
      var o = 0;
      if (t >= T.float[0] && t < T.vanish[1]){
        var tw = 0.35 + 0.35 * Math.sin(t / 260 + sp.phase);
        if (t >= T.vanish[0]) tw = Math.min(1, tw + 0.4 * seg(t, T.vanish));
        var fadeTail = t >= T.vanish[1] - 200 ? (T.vanish[1] - t) / 200 : 1;
        o = clamp(tw * fadeTail, 0, 1);
      }
      sp.el.setAttribute("opacity", o);
    });

    label.textContent = labelFor(t);
    fillEl.style.width = (t / TOTAL * 100) + "%";
  }

  // ---------- loop ----------
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var playing = !reduced;
  var startTime = null;
  var pausedAt = 0;

  function frame(now){
    if (startTime === null) startTime = now - pausedAt;
    var t = (now - startTime) % TOTAL;
    render(t);
    pausedAt = t;
    if (playing) requestAnimationFrame(frame);
  }

  stage.addEventListener("click", function(){
    playing = !playing;
    if (playing){
      startTime = null;
      requestAnimationFrame(frame);
    }
  });

  progressEl.addEventListener("click", function(e){
    var rect = progressEl.getBoundingClientRect();
    var frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    pausedAt = frac * TOTAL;
    startTime = null;
    if (!playing) render(pausedAt);
    else requestAnimationFrame(frame);
  });

  render(0);
  if (playing) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
